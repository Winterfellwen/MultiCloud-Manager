worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # WebSocket upgrade helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 安全响应头放在 http 级：
    # nginx 的 add_header 继承规则是「当前层级一旦定义 add_header，父级全部失效」。
    # 原先放在 server 级，任何带 add_header 的 location（如 /auth/ 的 no-cache）
    # 都会丢掉全部安全头；上移到 http 级后所有 location 默认继承，
    # 个别需要附加头的 location 在下方显式重复。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server {
        listen __NGINX_PORT__;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 健康检查：直接转发到 api-gateway
        location = /health {
            proxy_pass http://127.0.0.1:3000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # /health/all 暴露内部服务拓扑，仅本机探测可用（前端状态页同域访问不受影响）
        location = /health/all {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:3000/health/all;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # API 网关反向代理（尾斜杠移除 /api/ 前缀）
        location /api/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
        }

        # WebSocket 代理（AI 网关）
        location /ws {
            proxy_pass http://127.0.0.1:3005;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
        }

        # 认证服务（保留 /auth/ 路径，auth-service 路由本身有 /auth 前缀）
        # 注意：本 location 自带 add_header，需显式重复 http 级安全头
        location /auth/ {
            proxy_pass http://127.0.0.1:3004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # 用户管理（保留 /users/ 路径）
        location /users/ {
            proxy_pass http://127.0.0.1:3004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # 云服务（保留 /cloud/ 路径，cloud-service 路由本身有 /cloud 前缀）
        # 安全说明：cloud-service 已启用 JWT 鉴权钩子（onRequest），
        # 此直连路径不再是无鉴权旁路；统一审计入口仍推荐走 /api/cloud/。
        location /cloud/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # 监控服务（保留 /monitor/ 路径，monitor-service 路由本身有 /monitor 前缀）
        # 安全说明：monitor-service 已启用 JWT 鉴权钩子（onRequest）。
        location /monitor/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Prometheus metrics 端点：仅本机抓取（前端不依赖，无外部抓取证据；
        # 需要外部监控时在此按来源 IP 放行）
        location /metrics {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # AI 代理（保留 /agent/ 路径，ai-agent 路由本身有 /agent 前缀）
        location /agent/ {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # SPA 页面路由（精确匹配，避免尾斜杠被 API 代理拦截）
        location = /users { try_files /index.html /index.html; }
        location = /login { try_files /index.html /index.html; }
        location = /dashboard { try_files /index.html /index.html; }
        location = /resources { try_files /index.html /index.html; }
        location = /instances { try_files /index.html /index.html; }
        location = /monitor { try_files /index.html /index.html; }
        location = /costs { try_files /index.html /index.html; }
        location = /tools { try_files /index.html /index.html; }
        location = /mcp { try_files /index.html /index.html; }
        location = /audit { try_files /index.html /index.html; }
        location = /chat/react { try_files /index.html /index.html; }
        location = /ai-settings { try_files /index.html /index.html; }
        location = /cloud-accounts { try_files /index.html /index.html; }
        location = /topology { try_files /index.html /index.html; }
        location = /ai-ops { try_files /index.html /index.html; }
        location = /knowledge-base { try_files /index.html /index.html; }
        location = /notifications { try_files /index.html /index.html; }

        # 审计日志（保留 /audit/ 路径，api-gateway 路由本身有 /audit 前缀）
        # 注意：本 location 自带 add_header，需显式重复 http 级安全头
        location /audit/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # 前端静态资源：Vite 产物为内容 hash 文件名，可长缓存。
        # 用 expires 而非 add_header 设置缓存，避免触发 add_header 覆盖规则
        # 导致 http 级安全头在本 location 丢失。
        location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|ico|woff2?|ttf|map)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # 前端静态文件 + SPA fallback（最后匹配）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
